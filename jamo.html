<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
<title>jamo pipeline — v1</title>
<style>
  :root { --ink: #1c120a; --paper: #f0e6d3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #stage { position: relative; width: 100%; height: 100%; display: flex;
    flex-direction: column; }
  #syllable { position: absolute; top: 18%; left: 0; right: 0; text-align: center;
    font-size: 28vh; line-height: 1; pointer-events: none; }
  #draw { flex: 1; width: 100%; touch-action: none; cursor: crosshair; }
  #hud { position: absolute; left: 12px; bottom: 12px; font-size: 13px; opacity: 0.65;
    pointer-events: none; max-width: 40vw; }
  #last-jamo { font-size: 15px; }
  #log div { white-space: nowrap; }
  #hint { position: absolute; top: 12px; left: 0; right: 0; text-align: center;
    font-size: 14px; opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="hint">한글 자모를 하나씩 그려보세요 — draw one jamo at a time</div>
  <div id="syllable"></div>
  <canvas id="draw"></canvas>
  <div id="hud">
    <div>last jamo: <span id="last-jamo">—</span></div>
    <div id="log"></div>
  </div>
</div>
<script type="module" src="js/jamo/main.js"></script>
</body>
</html>
